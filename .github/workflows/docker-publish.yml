# SafeOS Guardian - container images
#
# The only workflow that publishes images. On every push to master that touches
# code or Docker files, and on a manual run from master, it builds and pushes
#   ghcr.io/<owner>/safeos-api  (the server)
#   ghcr.io/<owner>/safeos-ui   (the web app's static export behind nginx)
# for linux/amd64 and linux/arm64, so a 64-bit Raspberry Pi pulls the same
# tags as a PC. On a pull request that changes the Dockerfile, its inputs or
# this workflow, it builds both images for both platforms without pushing.
#
# Auth uses the built-in GITHUB_TOKEN (no extra secret).

name: Publish Docker images

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'package.json'
      - 'apps/guardian-ui/package.json'
      - 'apps/guardian-ui/package-lock.json'
      - 'apps/guardian-ui/next.config.js'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

# Publishes run one at a time and are never cancelled. A pull request's newer
# push cancels its older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('images-pr-{0}', github.event.pull_request.number) || 'images-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build ${{ github.event_name == 'pull_request' && 'only' || '& push' }} (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend
            image: safeos-api
          - target: frontend
            image: safeos-ui
    env:
      # Push only from master: a push event, or a manual run started on master.
      PUSH_IMAGES: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build${{ github.event_name != 'pull_request' && ' & push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* are inlined into the static export at build time. The
          # published ui image targets local trial (compose maps the API to
          # localhost:3001). Production deployments rebuild with their own URL.
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
            NEXT_PUBLIC_WS_URL=ws://localhost:3001
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ env.PUSH_IMAGES == 'true' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}
