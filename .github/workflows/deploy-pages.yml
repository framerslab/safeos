# SafeOS Guardian - Deploy to GitHub Pages
#
# The only workflow that deploys GitHub Pages. It builds the Guardian UI as a
# static export on every pull request (a build check, no deploy) and builds and
# deploys it on every push to master and on a manual run.
#
# The deployed app runs in local-only mode with:
# - TensorFlow.js for person/animal detection
# - Cache Storage for the agreed detection model download
# - IndexedDB for offline storage
# - Web Push notifications
#
# Backend features (SMS, Telegram, sync) require optional Linode backend.

name: Deploy SafeOS Guardian to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # Allow manual trigger

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# A pull request's newer push cancels that pull request's older build. Deploys
# (master pushes and manual runs) share one group and run one at a time; a
# running deploy is never cancelled, and a pull request can never cancel one.
# While a deploy runs, GitHub keeps only the newest waiting deploy, so the site
# goes straight to the newest commit.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/guardian-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/guardian-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_MODE: 'true'
          NEXT_PUBLIC_SITE_URL: 'https://safeos.sh'
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_WS_URL: ''

      - name: Install Chromium for offline regression
        # Use the runner libraries, as the picture capture jobs do.
        # An unrelated apt/font refresh must not block the offline check.
        run: npx playwright install chromium

      - name: Verify an unopened route starts offline
        run: node scripts/check-offline-start.mjs

      - name: Add .nojekyll file
        run: touch out/.nojekyll

      - name: Add CNAME file for custom domain
        run: echo "safeos.sh" > out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/guardian-ui/out

  # Deploy job (master pushes and manual runs only)
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # PR preview comment (for pull requests)
  preview-comment:
    # A pull request from a fork gets a read-only token, so only same-repository
    # pull requests get the comment.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    # The workflow grants only contents/pages/id-token; commenting on the pull
    # request needs write access to its issue thread.
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**SafeOS Guardian** build succeeded. Merge to deploy to GitHub Pages.'
            })
