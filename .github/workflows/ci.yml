# SafeOS Guardian - checks
#
# Runs every suite and check on each pull request and on each push to master.
# Any failure fails the run: nothing here is allowed to print an error and
# carry on. This workflow builds and tests only. GitHub Pages is deployed by
# deploy-pages.yml and the container images are published by
# docker-publish.yml; the static export is built on every pull request by
# deploy-pages.yml's build job. See docs/DEVELOPMENT.md.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run. Every
# other run (each master commit) has a group of its own, so none is cancelled
# or dropped from the queue: each master commit is checked to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job runs on ubuntu-24.04: ubuntu-latest moved to Ubuntu 26.04, where the
  # Playwright this app uses does not install its browsers.
  # ---------------------------------------------------------------------------
  # Server: type check and lint
  # ---------------------------------------------------------------------------
  server-checks:
    name: Server type check and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Server: tests with coverage
  # ---------------------------------------------------------------------------
  server-tests:
    name: Server tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install SQLite CLI for backup and restore tests
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: safeos
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Server: compile
  # ---------------------------------------------------------------------------
  server-build:
    name: Server build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Web app: type check, lint and Jest tests
  # ---------------------------------------------------------------------------
  web-checks:
    name: Web app type check and lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/guardian-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/guardian-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # The lockfile carries no ESLint, so the job adds the two packages that
      # `next lint` needs, pinned to the Next.js version in the lockfile,
      # without changing package.json or the lockfile.
      - name: Install ESLint for next lint
        run: npm install --no-save eslint@8.57.1 eslint-config-next@14.2.35

      - name: Lint
        run: npx next lint

  web-tests:
    name: Web app tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/guardian-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/guardian-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npx jest --ci

      # A stylesheet that names an animation with no @keyframes leaves it
      # standing still; the check reads every stylesheet the app ships.
      - name: Check that every stylesheet animation has its keyframes
        if: ${{ !cancelled() }}
        run: node --test scripts/css-animations.test.mjs

  # Walks the monitor in Chromium against the static export: a test camera
  # whose picture keeps changing, and the alerts that come while it does
  # (e2e/alerts-repeat.spec.ts); then each alert's picture, its box and its
  # close-up on the card, on the live picture, opened, in History and in the
  # notification (e2e/alert-pictures.spec.ts), with Chromium's fake camera
  # playing the committed sample clip or a canvas stream.
  web-alert-walk:
    name: Web app alert walk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/guardian-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/guardian-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_MODE: 'true'
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_WS_URL: ''

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Serve the site and walk the monitor
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 npx playwright test e2e/alerts-repeat.spec.ts --project=chromium --retries=0 --reporter=list

      # The repeat walk above needs no clip, so it runs before the clip's
      # files are made; the picture walk runs only once they are.
      - name: Install ffmpeg
        id: ffmpeg
        if: always()
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)

      # Chromium's fake camera reads a .y4m file and its fake microphone a
      # .wav file. Both are made here from the committed clip and never
      # committed, as pictures.yml makes them.
      - name: Make the fake camera's files from the sample clip
        id: clip
        if: always() && steps.ffmpeg.outcome == 'success'
        run: |
          ffmpeg -nostdin -v error -y -i public/home/sample-clip.mp4 -an -pix_fmt yuv420p "$RUNNER_TEMP/sample-clip.y4m"
          ffmpeg -nostdin -v error -y -i public/home/sample-clip.mp4 -vn -ac 1 -ar 48000 -c:a pcm_s16le "$RUNNER_TEMP/sample-clip.wav"
          ls -l "$RUNNER_TEMP"/sample-clip.*
          echo "SAMPLE_CLIP_Y4M=$RUNNER_TEMP/sample-clip.y4m" >> "$GITHUB_ENV"
          echo "SAMPLE_CLIP_WAV=$RUNNER_TEMP/sample-clip.wav" >> "$GITHUB_ENV"

      - name: Walk the alert pictures
        if: always() && steps.clip.outcome == 'success'
        run: |
          curl -sf http://127.0.0.1:4173/ >/dev/null || (python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/http.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 npx playwright test e2e/alert-pictures.spec.ts --project=chromium --retries=0 --reporter=list --workers=2 --grep-invert "A watch alert.s notification" --output="$RUNNER_TEMP/alert-pictures-results"

      # A notification waits 300 ms for its picture and then goes with its
      # words alone. The walks that read the picture in it run alone, with no
      # second worker drawing beside them on the runner.
      - name: Walk the alert notifications alone
        if: always() && steps.clip.outcome == 'success'
        run: |
          curl -sf http://127.0.0.1:4173/ >/dev/null || (python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/http.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 npx playwright test e2e/alert-pictures.spec.ts --project=chromium --retries=0 --reporter=list --workers=1 --grep "A watch alert.s notification" --output="$RUNNER_TEMP/alert-notification-results"

      # `npm run e2e` runs every project in playwright.config.ts. The walk
      # needs desktop Chromium, so under Firefox it skips instead of failing.
      # Settings, Notifications needs no camera: its check of the
      # notification's picture runs in Firefox itself, which shows a
      # notification's words alone.
      # Its own output folder keeps the walk's pictures above for the upload.
      - name: The walk under Firefox
        if: always()
        run: |
          npx playwright install --with-deps firefox
          curl -sf http://127.0.0.1:4173/ >/dev/null || (python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/http.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 npx playwright test e2e/alerts-repeat.spec.ts e2e/alert-pictures.spec.ts e2e/notification-picture-firefox.spec.ts --project=firefox --retries=0 --reporter=list --output="$RUNNER_TEMP/walk-firefox"

      - name: Upload the walk's report and pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-walk-report
          path: |
            apps/guardian-ui/test-results
            ${{ runner.temp }}/alert-pictures-results
            ${{ runner.temp }}/alert-notification-results
            ${{ runner.temp }}/walk-firefox
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Web app: Lost & Found in a browser. Builds the static site, serves it
  # inside the job and runs e2e/lost-found-edge.spec.ts in Chromium. The spec
  # enrols a subject from a striped picture, feeds Chromium's fake camera the
  # same stripes from a clip it writes itself, and reads the Edge value of the
  # match the monitor saves. It also walks /nap/ to the watch
  # (e2e/nap-opens-the-watch.spec.ts), and checks that the settings say what
  # the watch does: a critical alert in Emergency Only quiet hours, Detection's
  # use rows, set times at the browser's clock, the sound saved for a Lost &
  # Found alert, and the pitch range with two tones fed to the fake microphone.
  # It walks the watch's Watch for (e2e/watch-for.spec.ts) with axe in both
  # looks, a pet changed while the watch compares
  # (e2e/watch-for-pet-change.spec.ts), and a sighting's entry with the camera's
  # picture beside the pet's photo (e2e/lost-found-sighting.spec.ts). The other
  # specs in e2e/ are not run here.
  # ---------------------------------------------------------------------------
  web-lost-found:
    name: Web app Lost & Found browser test
    runs-on: ubuntu-24.04
    # Thirteen walks on one build, Watch for's among them with axe in both looks,
    # and a sighting's, which waits past the Cooldown Period twice.
    timeout-minutes: 55
    defaults:
      run:
        working-directory: apps/guardian-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/guardian-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_MODE: 'true'
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_WS_URL: ''

      - name: Install Chromium for Playwright
        # The Ubuntu runner already supplies the shared browser libraries.
        run: npx playwright install chromium

      - name: Serve the site and run the test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          npx playwright test e2e/lost-found-edge.spec.ts e2e/nap-opens-the-watch.spec.ts e2e/setup-lost-found.spec.ts \
            e2e/quiet-hours-critical.spec.ts e2e/detection-use-values.spec.ts e2e/set-times-apply.spec.ts \
            e2e/lost-found-sound.spec.ts e2e/lost-found-sound-stop.spec.ts e2e/sound-pitch-range.spec.ts e2e/watch-for.spec.ts \
            e2e/watch-for-pet-change.spec.ts e2e/lost-found-sighting.spec.ts e2e/lost-found-words.spec.ts \
            --project=chromium

      - name: Upload the test's report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lost-found-browser-test
          path: |
            apps/guardian-ui/playwright-report
            apps/guardian-ui/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the Nap Mode pictures
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nap-pictures
          path: |
            apps/guardian-ui/test-results/**/nap-*-1280.png
            apps/guardian-ui/test-results/**/test-alerts-*-1280.png
            apps/guardian-ui/test-results/**/setup-*-1280.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the settings pictures
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: settings-pictures
          path: |
            apps/guardian-ui/test-results/**/quiet-hours-critical-1280.png
            apps/guardian-ui/test-results/**/detection-baby-row-1280.png
            apps/guardian-ui/test-results/**/set-time-night-1280.png
            apps/guardian-ui/test-results/**/set-time-needs-a-setting-*-1280.png
            apps/guardian-ui/test-results/**/set-time-account-restored-1280.png
            apps/guardian-ui/test-results/**/watch-for-cleared-in-another-tab-1280.png
            apps/guardian-ui/test-results/**/watch-for-pet-changed-1280.png
            apps/guardian-ui/test-results/**/watch-for-pet-on-picture-1280.png
            apps/guardian-ui/test-results/**/watch-for-photo-kept-390.png
            apps/guardian-ui/test-results/**/watch-for-long-name-320.png
            apps/guardian-ui/test-results/**/lost-found-alert-1280.png
            apps/guardian-ui/test-results/**/sounds-played-1280.png
            apps/guardian-ui/test-results/**/pitch-range-*-1280.png
            apps/guardian-ui/test-results/**/lost-found-setup-words-1280.png
            apps/guardian-ui/test-results/**/lost-found-watch-words-1280.png
            apps/guardian-ui/test-results/**/lost-found-overlay-words-1280*.png
            apps/guardian-ui/test-results/**/lost-found-kept-*-1280.png
            apps/guardian-ui/test-results/**/lost-found-gallery-words-1280.png
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Compose files: only the reverse proxy publishes a port beyond loopback.
  # Docker's published ports bypass the host firewall, so Ollama, Redis and the
  # API bind 127.0.0.1 or stay on the compose network.
  # ---------------------------------------------------------------------------
  compose-ports:
    name: Compose ports
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve every compose file and check its published ports
        run: |
          docker compose version
          bash scripts/check-compose-ports.sh .

      - name: The check rejects and accepts its fixtures
        run: |
          for d in scripts/testdata/compose-ports/reject-*; do
            if bash scripts/check-compose-ports.sh "$d"; then
              echo "::error::$d passed the check but must fail it"
              exit 1
            fi
          done
          for d in scripts/testdata/compose-ports/accept-*; do
            bash scripts/check-compose-ports.sh "$d"
          done

      # The API trusts X-Forwarded-For only from Caddy's fixed address on the
      # proxy network. Start that network's services from stand-in images, in
      # the production file's order, and check Caddy gets that address.
      - name: Start the proxy network and check the proxy's address
        run: bash scripts/check-compose-proxy-network.sh .

  account-pictures:
    name: Account form pictures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies and Chromium
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @playwright/test@1.56.1
          npx playwright install chromium
      - name: Capture API account forms
        run: npx tsx scripts/capture-account-pictures.ts "$RUNNER_TEMP/account-pictures"
      - name: Upload account pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-pictures
          path: ${{ runner.temp }}/account-pictures/*.png
          if-no-files-found: error
          retention-days: 14
