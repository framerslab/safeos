# SafeOS Guardian - checks
#
# Runs every suite and check on each pull request and on each push to master.
# Any failure fails the run: nothing here is allowed to print an error and
# carry on. This workflow builds and tests only. GitHub Pages is deployed by
# deploy-pages.yml and the container images are published by
# docker-publish.yml; the static export is built on every pull request by
# deploy-pages.yml's build job. See docs/DEVELOPMENT.md.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run. Every
# other run (each master commit) has a group of its own, so none is cancelled
# or dropped from the queue: each master commit is checked to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Server: type check and lint
  # ---------------------------------------------------------------------------
  server-checks:
    name: Server type check and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Server: tests with coverage
  # ---------------------------------------------------------------------------
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install SQLite CLI for backup and restore tests
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: safeos
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Server: compile
  # ---------------------------------------------------------------------------
  server-build:
    name: Server build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Web app: type check, lint and Jest tests
  # ---------------------------------------------------------------------------
  web-checks:
    name: Web app type check and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/guardian-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/guardian-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # The lockfile carries no ESLint, so the job adds the two packages that
      # `next lint` needs, pinned to the Next.js version in the lockfile,
      # without changing package.json or the lockfile.
      - name: Install ESLint for next lint
        run: npm install --no-save eslint@8.57.1 eslint-config-next@14.2.35

      - name: Lint
        run: npx next lint

  web-tests:
    name: Web app tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/guardian-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/guardian-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npx jest --ci

  # ---------------------------------------------------------------------------
  # Compose files: only the reverse proxy publishes a port beyond loopback.
  # Docker's published ports bypass the host firewall, so Ollama, Redis and the
  # API bind 127.0.0.1 or stay on the compose network.
  # ---------------------------------------------------------------------------
  compose-ports:
    name: Compose ports
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve every compose file and check its published ports
        run: |
          docker compose version
          bash scripts/check-compose-ports.sh .

      - name: The check rejects and accepts its fixtures
        run: |
          for d in scripts/testdata/compose-ports/reject-*; do
            if bash scripts/check-compose-ports.sh "$d"; then
              echo "::error::$d passed the check but must fail it"
              exit 1
            fi
          done
          for d in scripts/testdata/compose-ports/accept-*; do
            bash scripts/check-compose-ports.sh "$d"
          done
