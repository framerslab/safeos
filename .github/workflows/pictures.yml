# SafeOS Guardian - pictures of the web app
#
# Builds the static site, serves it inside the job and captures each route at
# 390, 820, 1280 and 1920 pixels wide in the light and the dark look with
# Playwright. The PNG files are uploaded as the run's "pictures" artifact. Pull
# requests also capture the base commit with the same routes as
# "pictures-before". The pull request's own capture also checks a first visit
# to the home page (the header row, the look switch, no notification prompt,
# heading contrast, the Menu on a short screen), walks the home page part by part
# (scripts/home-checks.mjs) and checks the Test
# Alerts page's alert key (its generated tones start, an analyser on the
# way to the speakers reads signal, no sound file is asked for). Both
# versions capture the dashboard after setup; the pull request's own capture
# checks that the dashboard's four ways to watch open their pages, and walks
# the app's pages with scripts/app-checks.mjs.
# Both versions capture the monitor on a device whose setup chose Lost & Found,
# with no pet saved and with a pet; the pull request's own capture checks that
# Watch for shows Lost and Found checked with "No pet saved" or the pet.
# Both versions capture setup's camera step after a refused camera request;
# the pull request's own capture walks setup to the dashboard with no camera;
# see scripts/capture-pictures.mjs.
#
# Opening or updating a pull request captures both versions automatically so changed screens
# have before and after pictures. Workflow dispatch remains available for other refs.
#
# A third job, "Capture the home page pictures", makes the pictures the home
# page itself shows. It builds the same commit, feeds Chromium's fake camera
# and microphone from the committed sample clip
# (apps/guardian-ui/public/home/sample-clip.mp4, converted to .y4m and .wav
# inside the job) and runs scripts/home-captures.mjs, which opens the monitor,
# presses its own "Start Monitoring" key, waits for a motion alert and saves
# the capture's three crops in both looks, the two install screenshots, the
# shared-link card and provenance.json. They are uploaded as the run's
# "home-pictures" artifact and committed under apps/guardian-ui/public/ from
# there; a pull request that changes what the monitor draws commits them again.

name: Pictures

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: master
      routes:
        description: Routes to capture, separated by spaces
        required: true
        default: / /monitor/ /setup/ /settings/ /help/
  pull_request:
    types: [opened, labeled, synchronize, reopened]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pictures-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  DEFAULT_ROUTES: / /monitor/ /setup/ /dashboard/ /history/ /settings/ /settings/data/ /settings/sounds/ /settings/notifications/ /settings/models/ /nap/ /admin/ /privacy/ /faq/ /help/ /help/integrations/telegram/ /security/ /wildlife/ /export/ /about/ /blog/ /blog/how-safeos-guardian-works/ /tutorials/ /tutorial/ /donate/ /terms/ /lost-found/ /lost-found/gallery/ /404.html

jobs:
  # Every job runs on ubuntu-24.04: ubuntu-latest moved to Ubuntu 26.04, where the
  # Playwright this app uses does not install its browsers.
  pictures:
    name: ${{ matrix.version == 'before' && 'Capture before pictures' || 'Capture pictures' }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'pull_request' && '["after","before"]' || '["after"]') }}
    runs-on: ubuntu-24.04
    # A capture at four widths takes about fifteen minutes; the app's walks,
    # the Settings walks among them, add to it.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/guardian-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version == 'before' && github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || '') }}

      # Both versions use the same session fixture and capture script.
      - name: Use the pull request capture script
        if: github.event_name == 'pull_request'
        env:
          CAPTURE_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$CAPTURE_REF"
          git show "$CAPTURE_REF:apps/guardian-ui/scripts/capture-pictures.mjs" > scripts/capture-pictures.mjs
          git show "$CAPTURE_REF:apps/guardian-ui/scripts/base-routes.mjs" > scripts/base-routes.mjs
          git show "$CAPTURE_REF:apps/guardian-ui/scripts/watch-page-captures.mjs" > scripts/watch-page-captures.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/guardian-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The star count beside the GitHub link, read once and handed to the
      # build and to the capture, which checks the pages against it. The base
      # commit of a pull request may be older than the script. A read that
      # fails leaves a warning and no count: the pictures then show the link
      # with its word alone.
      - name: Read the repository's star count
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/read-github-stars.mjs ]; then
            node scripts/read-github-stars.mjs
          fi

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_MODE: 'true'
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_WS_URL: ''

      - name: Install Chromium for Playwright
        # The Ubuntu runner already supplies the shared browser libraries.
        # Install the pinned browser without an unrelated apt/font refresh.
        run: npx playwright install chromium

      - name: Serve the site and capture
        env:
          PICTURE_VERSION: ${{ matrix.version }}
          ROUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.routes || env.DEFAULT_ROUTES }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          # ROUTES is split on spaces on purpose (one argument per route), with
          # filename globbing off.
          set -f
          # shellcheck disable=SC2086
          node scripts/capture-pictures.mjs http://127.0.0.1:4173 "$RUNNER_TEMP/pictures" $ROUTES

      - name: Set up Python for the home pixel sampler
        if: always() && matrix.version == 'after'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Measure home readability from the captured pixels
        if: always() && matrix.version == 'after'
        env:
          ROUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.routes || env.DEFAULT_ROUTES }}
        run: |
          set -f
          for route in $ROUTES; do
            [ "$route" = / ] || continue
            if [ ! -s "$RUNNER_TEMP/pictures/home-readability-boxes.json" ]; then
              echo "::error::Missing home-readability-boxes.json for the home route" >&2
              exit 1
            fi
            python3 -m venv "$RUNNER_TEMP/home-pixels"
            "$RUNNER_TEMP/home-pixels/bin/python3" -m pip install --quiet Pillow==11.3.0
            "$RUNNER_TEMP/home-pixels/bin/python3" -I scripts/contrast-sample.py "$RUNNER_TEMP/pictures" --runs out/home/runs/runs.json
            break
          done

      - name: Upload pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version == 'before' && 'pictures-before' || 'pictures' }}
          path: |
            ${{ runner.temp }}/pictures/*.png
            ${{ runner.temp }}/pictures/home-readability.json
            ${{ runner.temp }}/pictures/home-first-bounds.json
          if-no-files-found: error
          retention-days: 14

      - name: Check the People alert pictures at 390 and 1440 px
        if: ${{ !cancelled() }}
        env:
          ROUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.routes || env.DEFAULT_ROUTES }}
        run: |
          case " $ROUTES " in
            *" /security/ "*) ;;
            *) exit 0 ;;
          esac
          missing=0
          for width in 390 1440; do
            for look in light dark; do
              for view in sighting count notification; do
                file="people-$view-$width-$look.png"
                if [ ! -s "$RUNNER_TEMP/pictures/$file" ]; then
                  echo "::error::Missing People alert picture: $file"
                  missing=1
                fi
              done
            done
          done
          exit "$missing"

      - name: Upload watch page and desktop header pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version == 'before' && 'watch-pages-before' || 'watch-pages' }}
          path: |
            ${{ runner.temp }}/pictures/people-sighting-*.png
            ${{ runner.temp }}/pictures/people-count-*.png
            ${{ runner.temp }}/pictures/people-notification-*.png
            ${{ runner.temp }}/pictures/wildlife-sighting-*.png
            ${{ runner.temp }}/pictures/wildlife-kept-*.png
            ${{ runner.temp }}/pictures/wildlife-notification-*.png
            ${{ runner.temp }}/pictures/wildlife-caution-*.png
            ${{ runner.temp }}/pictures/*-keys-320-light.png
            ${{ runner.temp }}/pictures/site-header-1024-*.png
            ${{ runner.temp }}/pictures/site-header-1440-*.png
          if-no-files-found: ignore
          retention-days: 14

  home-captures:
    name: Capture the home page pictures
    runs-on: ubuntu-24.04
    # The home captures, the alert pictures in each state, width and look, then the probe.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/guardian-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || '') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/guardian-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The count, read as the pictures job reads it, so the home page's
      # pictures show the GitHub link as the deployed site does.
      - name: Read the repository's star count
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/read-github-stars.mjs ]; then
            node scripts/read-github-stars.mjs
          fi

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_MODE: 'true'
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_WS_URL: ''

      - name: Install Chromium for Playwright
        run: npx playwright install chromium

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update || true; sudo apt-get install -y --no-install-recommends ffmpeg)

      # Chromium's fake camera reads a .y4m file and its fake microphone a
      # .wav file. Both are made here from the committed clip and never
      # committed.
      - name: Make the fake camera's files from the sample clip
        run: |
          ffmpeg -nostdin -v error -y -i public/home/sample-clip.mp4 -an -pix_fmt yuv420p "$RUNNER_TEMP/sample-clip.y4m"
          ffmpeg -nostdin -v error -y -i public/home/sample-clip.mp4 -vn -ac 1 -ar 48000 -c:a pcm_s16le "$RUNNER_TEMP/sample-clip.wav"
          ls -l "$RUNNER_TEMP"/sample-clip.*

      - name: Serve the site and capture the monitor
        env:
          CAPTURE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The commit the job checked out and built, whatever the event's own commit.
          export CAPTURE_COMMIT="$(git rev-parse HEAD)"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/home-captures.mjs http://127.0.0.1:4173 "$RUNNER_TEMP/home-pictures" "$RUNNER_TEMP/sample-clip.y4m" "$RUNNER_TEMP/sample-clip.wav"

      # The alert pictures in each of their states, on the same served site: an
      # alert's card, the picture opened, History, the two settings groups, the
      # notice, the notification setting, the live box and a sighting. A state
      # the script cannot reach fails the step, naming the state.
      # A manual run on a commit from before the alert pictures has no script
      # for them: both of their steps are left out there. Where the script is,
      # a state it cannot reach still fails the step.
      - name: Look for the alert pictures script
        id: alert-script
        run: |
          if [ -f scripts/alert-picture-captures.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No alert pictures script at this commit: its captures are left out."
          else
            echo "::error::scripts/alert-picture-captures.mjs is missing: a pull request's run keeps its alert pictures."
            exit 1
          fi

      - name: Capture the alert pictures
        if: steps.alert-script.outputs.present == 'true'
        env:
          CAPTURE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export CAPTURE_COMMIT="$(git rev-parse HEAD)"
          curl -sf http://127.0.0.1:4173/ >/dev/null || (python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/http.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/alert-picture-captures.mjs http://127.0.0.1:4173 "$RUNNER_TEMP/alert-pictures" "$RUNNER_TEMP/sample-clip.y4m" "$RUNNER_TEMP/sample-clip.wav"

      # Enrols the Lost and Found example's photos as a person would, the
      # three of them (set A) and photo 1 alone (set B, the home page run's),
      # watches the sample clip through the fake camera at the app's default
      # settings and fails when the watch does not alert for a set. Its result,
      # lost-found-probe.json, goes into the capture's folder, so the
      # home-pictures artifact carries it. It runs after a failed capture as
      # well, but not in a run that was cancelled.
      - name: Probe Lost and Found on the sample clip
        if: ${{ !cancelled() }}
        env:
          CAPTURE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A run started by hand on a commit from before the probe has nothing to run.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ ! -f scripts/lost-found-probe.mjs ]; then
            echo "probe: this commit has no Lost and Found probe"
            exit 0
          fi
          export CAPTURE_COMMIT="$(git rev-parse HEAD)"
          curl -sf http://127.0.0.1:4173/ >/dev/null || (python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/http.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/lost-found-probe.mjs http://127.0.0.1:4173 "$RUNNER_TEMP/home-pictures" "$RUNNER_TEMP/sample-clip.y4m" "$RUNNER_TEMP/sample-clip.wav"

      - name: Upload the home page pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-pictures
          path: ${{ runner.temp }}/home-pictures
          if-no-files-found: error
          retention-days: 14

      - name: Upload the alert pictures
        if: always() && steps.alert-script.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alert-pictures
          path: ${{ runner.temp }}/alert-pictures
          if-no-files-found: error
          retention-days: 14

  record-home-runs:
    name: Record the home page runs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/guardian-ui
    steps:
      - name: Check out the recording source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/guardian-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Read the repository's star count
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/read-github-stars.mjs

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_MODE: 'true'
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_WS_URL: ''

      - name: Install Chromium for Playwright
        run: npx playwright install chromium

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update || true; sudo apt-get install -y --no-install-recommends ffmpeg)

      - name: Prepare the sample clip for the camera and microphone
        run: |
          ffmpeg -nostdin -v error -y -i public/home/sample-clip.mp4 -an -pix_fmt yuv420p "$RUNNER_TEMP/sample.y4m"
          ffmpeg -nostdin -v error -y -i public/home/sample-clip.mp4 -vn -ac 1 -ar 48000 -c:a pcm_s16le "$RUNNER_TEMP/sample.wav"

      - name: Serve the static site and record
        env:
          CAPTURE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export CAPTURE_COMMIT="$(git rev-parse HEAD)"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >"$RUNNER_TEMP/home-run-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null || exit 1
          node scripts/home-runs.mjs http://127.0.0.1:4173 "$RUNNER_TEMP/home-runs" "$RUNNER_TEMP/sample.y4m" "$RUNNER_TEMP/sample.wav"

      - name: Upload the recorded runs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: home-runs
          path: ${{ runner.temp }}/home-runs
          if-no-files-found: error
          retention-days: 14

      - name: Upload recording diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: home-run-diagnostics
          path: ${{ runner.temp }}/home-run-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  check-home-runs:
    name: Check the committed home runs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: apps/guardian-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/guardian-ui/package-lock.json

      - run: npm ci

      - name: Check which files change the recording input digest
        run: node scripts/home-run-inputs.mjs --prove-input-digest public

      - name: Check the source commit and producer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRODUCER_COMMIT="$(node -p "require('./public/home/runs/runs.json').commit")"
          PRODUCER_RUN_ID="$(node -p "new URL(require('./public/home/runs/runs.json').run).pathname.split('/').pop()")"
          git merge-base --is-ancestor "$PRODUCER_COMMIT" HEAD
          RECORD_JOB="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/jobs" --jq             '.jobs[] | select(.name == "Record the home page runs" and .conclusion == "success") | .id')"
          test -n "$RECORD_JOB"
          LIVE_ARTIFACT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts" --jq             '.artifacts[] | select(.name == "home-runs" and .expired == false) | .id')"
          if [ -n "$LIVE_ARTIFACT" ]; then
            gh run download "$PRODUCER_RUN_ID" --repo "$GITHUB_REPOSITORY" --name home-runs --dir "$RUNNER_TEMP/producer"
            node scripts/home-run-inputs.mjs --compare-artifact public "$RUNNER_TEMP/producer"
          else
            echo "The producer artifact is no longer retained. The successful job and committed hashes still apply."
          fi

      - name: Check source and file hashes of the committed runs
        run: node scripts/home-run-inputs.mjs --verify-committed public

      - name: Install ffmpeg
        if: ${{ !cancelled() }}
        run: command -v ffmpeg || (sudo apt-get update || true; sudo apt-get install -y --no-install-recommends ffmpeg)

      - name: Test the recording scripts
        if: ${{ !cancelled() }}
        run: node --test scripts/home-run-scripts.test.mjs

      - name: Check that each Watching recording holds its alert at the end
        if: ${{ !cancelled() }}
        run: node scripts/home-run-held.mjs public
