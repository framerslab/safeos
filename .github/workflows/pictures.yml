# SafeOS Guardian - pictures of the web app
#
# Builds the static site, serves it inside the job and captures each route at
# 390 and 1280 pixels wide in the light and the dark look with Playwright. The
# PNG files are uploaded as the run's "pictures" artifact. Pull requests also
# capture the base commit with the same routes as "pictures-before".
#
# Start it by hand (Actions > Pictures > Run workflow: a ref and a list of
# routes), or add the label "pictures" to a pull request: it then runs on the
# labelling and on every later push to that pull request, with the default
# routes.

name: Pictures

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: master
      routes:
        description: Routes to capture, separated by spaces
        required: true
        default: / /monitor/ /setup/ /settings/ /help/
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pictures-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  DEFAULT_ROUTES: / /monitor/ /setup/ /dashboard/ /settings/ /settings/notifications/ /settings/models/ /nap/ /admin/ /privacy/ /faq/ /help/ /security/ /wildlife/

jobs:
  pictures:
    name: ${{ matrix.version == 'before' && 'Capture before pictures' || 'Capture pictures' }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'pull_request' && '["after","before"]' || '["after"]') }}
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'pictures')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/guardian-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version == 'before' && github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || '') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/guardian-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_MODE: 'true'
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_WS_URL: ''

      - name: Install Chromium for Playwright
        # The Ubuntu runner already supplies the shared browser libraries.
        # Install the pinned browser without an unrelated apt/font refresh.
        run: npx playwright install chromium

      - name: Serve the site and capture
        env:
          ROUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.routes || env.DEFAULT_ROUTES }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          # ROUTES is split on spaces on purpose (one argument per route), with
          # filename globbing off.
          set -f
          # shellcheck disable=SC2086
          node scripts/capture-pictures.mjs http://127.0.0.1:4173 "$RUNNER_TEMP/pictures" $ROUTES

      - name: Upload pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version == 'before' && 'pictures-before' || 'pictures' }}
          path: ${{ runner.temp }}/pictures/*.png
          if-no-files-found: error
          retention-days: 14
