<!doctype html>
<!--
  The shared-link card's page. scripts/home-captures.mjs fills it in and saves
  it as public/home/card.jpg (1200 by 630); the site does not serve this page.
  It holds the mark, the wordmark, the home page's headline and the real
  capture of the monitor, in the dark look's colours. Every word is 64 px or
  more, so it is 16 px when a service shows the card 300 px wide.
-->
<html lang="en" class="dark {{FONTS}}">
<head>
<meta charset="utf-8">
{{STYLES}}
<style>
  html, body { margin: 0; padding: 0; background: #0b131b; }
  .card {
    box-sizing: border-box;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 372px;
    column-gap: 40px;
    align-items: center;
    width: 1200px;
    height: 630px;
    padding: 48px 56px;
    overflow: hidden;
    background: #0b131b;
    color: #f4f5f6;
    font-family: var(--font-space-grotesk), sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 24px; }
  .brand img { width: 124px; height: 124px; }
  .wordmark { display: flex; flex-direction: column; font-size: 64px; line-height: 68px; letter-spacing: 0.08em; text-transform: uppercase; }
  .wordmark b { color: #f4f5f6; font-weight: 700; }
  .wordmark span { color: #c4c9d1; font-weight: 400; }
  h1 { margin: 28px 0 0; color: #f4f5f6; font-size: 64px; line-height: 68px; font-weight: 700; text-wrap: balance; }
  .capture { position: relative; width: 372px; height: 465px; }
  .capture img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .capture i { position: absolute; width: 14px; height: 14px; border: 0 solid #4ade80; }
  .capture i:nth-of-type(1) { top: -6px; left: -6px; border-top-width: 2px; border-left-width: 2px; }
  .capture i:nth-of-type(2) { top: -6px; right: -6px; border-top-width: 2px; border-right-width: 2px; }
  .capture i:nth-of-type(3) { bottom: -6px; left: -6px; border-bottom-width: 2px; border-left-width: 2px; }
  .capture i:nth-of-type(4) { right: -6px; bottom: -6px; border-right-width: 2px; border-bottom-width: 2px; }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="brand">
        <img src="/logo.svg" alt="">
        <div class="wordmark"><b data-words>SafeOS</b><span data-words>Guardian</span></div>
      </div>
      <h1 data-words>{{HEADLINE}}</h1>
    </div>
    <div class="capture">
      <img src="{{CAPTURE}}" alt="">
      <i></i><i></i><i></i><i></i>
    </div>
  </div>
</body>
</html>
